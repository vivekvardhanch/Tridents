<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tridents Cricket</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes slideUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
  .spinner{animation:spin .75s linear infinite}
  .live-dot{animation:pulse 1.5s infinite}
  .card-in{animation:slideUp .18s ease}
  input:focus,select:focus,textarea:focus{outline:2px solid #16a34a;outline-offset:1px}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:99px}
</style>
</head>
<body class="bg-stone-100 min-h-screen font-sans text-stone-900">

<!-- ═══ HEADER ══════════════════════════════════════════════════════════════ -->
<header class="sticky top-0 z-50 bg-white border-b border-stone-200 shadow-sm">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3 flex-wrap">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 bg-gradient-to-br from-green-500 to-green-700 rounded-xl flex items-center justify-center text-white font-black text-base shadow select-none">T</div>
      <div>
        <div class="font-bold text-base text-stone-900 leading-tight">Tridents Cricket</div>
        <div id="hdr-sub" class="text-xs text-stone-400 leading-tight">Connecting…</div>
      </div>
      <span id="live-badge" class="hidden items-center gap-1 text-xs font-bold text-green-700 bg-green-50 border border-green-200 px-2 py-0.5 rounded-full">
        <span class="w-1.5 h-1.5 bg-green-500 rounded-full live-dot"></span>Live
      </span>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs text-stone-400 font-medium shrink-0">Playing as:</span>
      <select id="player-sel" onchange="onPlayerChange()" class="text-sm border border-stone-300 rounded-lg px-2.5 py-1.5 max-w-[190px] bg-white cursor-pointer">
        <option value="">— select your name —</option>
      </select>
    </div>
  </div>
</header>

<!-- ═══ TOP TABS ═════════════════════════════════════════════════════════════ -->
<div class="bg-white border-b border-stone-200 sticky top-[61px] z-40">
  <div class="max-w-5xl mx-auto px-4 flex">
    <button onclick="setTopTab('archive',this)" id="ttab-archive"
      class="top-tab px-5 py-3 text-sm font-bold border-b-2 border-transparent text-stone-400 hover:text-stone-600 transition-colors">
      🗄️ Archive
    </button>
    <button onclick="setTopTab('ms2026',this)" id="ttab-ms2026"
      class="top-tab px-5 py-3 text-sm font-bold border-b-2 border-green-600 text-green-700">
      🏆 Mega Smash 2026
    </button>
  </div>
</div>

<!-- ═══ SUB-TABS (Mega Smash only) ══════════════════════════════════════════ -->
<div id="ms-subtabs" class="bg-white border-b border-stone-200">
  <div class="max-w-5xl mx-auto px-4 flex">
    <button onclick="setSubTab('roster',this)" id="stab-roster"
      class="sub-tab px-4 py-2.5 text-sm font-bold border-b-2 border-blue-600 text-blue-700">
      👥 Roster
    </button>
    <button onclick="setSubTab('matches',this)" id="stab-matches"
      class="sub-tab px-4 py-2.5 text-sm font-bold border-b-2 border-transparent text-stone-400 hover:text-stone-600 transition-colors">
      🏏 Match Schedule
    </button>
    <button onclick="setSubTab('umpiring',this)" id="stab-umpiring"
      class="sub-tab px-4 py-2.5 text-sm font-bold border-b-2 border-transparent text-stone-400 hover:text-stone-600 transition-colors">
      🦺 Umpiring
    </button>
  </div>
</div>

<!-- ═══ MAIN ═════════════════════════════════════════════════════════════════ -->
<main class="max-w-5xl mx-auto px-4 py-6">
  <div id="loading" class="text-center py-20">
    <div class="w-9 h-9 border-2 border-stone-200 border-t-green-500 rounded-full spinner mx-auto mb-3"></div>
    <p class="text-stone-400 text-sm">Connecting to live database…</p>
  </div>
  <div id="sec-archive"  class="section hidden"></div>
  <div id="sec-roster"   class="section hidden"></div>
  <div id="sec-matches"  class="section hidden"></div>
  <div id="sec-umpiring" class="section hidden"></div>
</main>

<!-- ═══ TOAST ════════════════════════════════════════════════════════════════ -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-stone-900 text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow-xl z-[999] opacity-0 pointer-events-none whitespace-nowrap" style="transition:opacity .2s"></div>

<!-- ═══ APP SCRIPT ═══════════════════════════════════════════════════════════ -->
<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, update, remove, push }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ─── Firebase ──────────────────────────────────────────────────────────── */
const db = getDatabase(initializeApp({
  apiKey:"AIzaSyCf4yVEVYJlClHy32xT-gJGMvLRYqTL1WA",
  authDomain:"tridents-cricket-umpiring.firebaseapp.com",
  databaseURL:"https://tridents-cricket-umpiring-default-rtdb.firebaseio.com",
  projectId:"tridents-cricket-umpiring",
  storageBucket:"tridents-cricket-umpiring.firebasestorage.app",
  messagingSenderId:"326410349165",
  appId:"1:326410349165:web:3fac546c1bb8bed8f46d64"
}));

/* ─── Seed data ─────────────────────────────────────────────────────────── */
const DEFAULT_ROSTER = [
  "Phani Someshwar Hari","Anirban Chakraborty","Guru Prasad Selvarajan","Hemanth G",
  "Kuraku Vinod","Navaneeth Narayanaswamy","Nikhil Kasula","Ravi Singiresu",
  "Revanth Gajjala","Sai Sanath Krishnappagari","Sai Shanker Gaddam",
  "Santhosh Kumar Peri","Sivapradeep Kolluri","Srikanth G","Sumanta Boruah",
  "Vishwadhar Shreedhar","Vivek Chapa","Vivek Teja","Yasaswi Ravipati"

const MATCH_SEED = [
  {id:'m0',  date:'7/12/2026',  time:'8:00 AM',  opponent:'RedHawks',             isHome:true,  venue:'RTPPark Field 4',                 division:'D2'},
  {id:'m1',  date:'7/18/2026',  time:'2:00 PM',  opponent:'ZenStarz',             isHome:false, venue:'RTPPark Field 1',                 division:'D2'},
  {id:'m2',  date:'8/1/2026',   time:'5:00 PM',  opponent:'Garudas HT',           isHome:false, venue:'Bethesda Cricket Ground - Lower', division:'D2'},
  {id:'m3',  date:'8/8/2026',   time:'2:00 PM',  opponent:'Carolina Islanders',   isHome:false, venue:'Bethesda Cricket Ground - Upper', division:'D2'},
  {id:'m4',  date:'8/9/2026',   time:'5:00 PM',  opponent:'RTP Chargers',         isHome:false, venue:'Bethesda Cricket Ground - Upper', division:'D2'},
  {id:'m5',  date:'8/16/2026',  time:'12:00 PM', opponent:'Mutants',              isHome:false, venue:'Apex Jaycee Park',                division:'D2'},
  {id:'m6',  date:'8/22/2026',  time:'1:00 PM',  opponent:'Stallions',            isHome:false, venue:'C. R. Woods Park',                division:'D2'},
  {id:'m7',  date:'8/30/2026',  time:'7:30 AM',  opponent:'Super Gillies',        isHome:true,  venue:'River Forest Park Ground',        division:'D2'},
  {id:'m8',  date:'9/13/2026',  time:'10:00 AM', opponent:'Unicorns',             isHome:false, venue:'RTPPark Field 1',                 division:'D2'},
  {id:'m9',  date:'9/19/2026',  time:'6:00 PM',  opponent:'Cary Cricketers - HT', isHome:false, venue:'RTPPark Field 4',                division:'D2'},
  {id:'m10', date:'10/3/2026',  time:'9:45 AM',  opponent:'WhiteWalkers',         isHome:false, venue:'Century Fields 3',                division:'D2'},
  {id:'m11', date:'10/4/2026',  time:'9:45 AM',  opponent:'Predators',            isHome:false, venue:'Century Fields 3',                division:'D2'},
  {id:'m12', date:'10/18/2026', time:'3:00 PM',  opponent:'12th Man HT',          isHome:false, venue:'Apex Jaycee Park',                division:'D2'},
];

const UMP_SEED = [
  {id:'u0', date:'7/19/2026', time:'8:00 AM',  team1:'RAGING BULLS',  team2:'POWER RANGERS', venue:'FVAA Lower',         division:'D3'},
  {id:'u1', date:'7/25/2026', time:'9:30 AM',  team1:'Hunters',       team2:'Panthers',      venue:'C. R. Wood Park',    division:'D1'},
  {id:'u2', date:'8/2/2026',  time:'2:00 PM',  team1:'Cary Avengers', team2:'RTP Tigers',    venue:'River Forest Park',  division:'D7'},
];

/* ─── State ─────────────────────────────────────────────────────────────── */
let S = { roster:{}, matches:{}, matchAvail:{}, umpGames:{}, umpSlots:{}, archiveV2:{} };
let currentPlayer = localStorage.getItem('tridents_player') || '';
let topTab  = 'ms2026';
let subTab  = 'roster';
let seeded  = false;
let showAddUmpForm = false;

/* ─── Helpers ───────────────────────────────────────────────────────────── */
const pKey     = n => String(n).replace(/[.#$[\]/\s]/g,'_');
const esc      = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rList    = () => Object.values(S.roster).sort((a,b)=>a.name.localeCompare(b.name));
const pName    = k => S.roster[k]?.name || k;

const toast = (msg, ms=2600) => {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.opacity='0', ms);
};

function dateSort(d) {
  if (!d||d==='TBD') return '99999999';
  const p = d.split('/');
  return p.length===3 ? `${p[2]}${p[0].padStart(2,'0')}${p[1].padStart(2,'0')}` : d;
}

function isPast(dateStr) {
  if (!dateStr||dateStr==='TBD') return false;
  const p = dateStr.split('/');
  if (p.length!==3) return false;
  const gd = new Date(+p[2], +p[0]-1, +p[1]);
  const td = new Date(); td.setHours(0,0,0,0);
  return gd < td;
}

/* ─── Firebase listeners ────────────────────────────────────────────────── */
onValue(ref(db,'/ms2026'), snap => {
  const v = snap.val() || {};
  S.roster    = v.roster    || {};
  S.matches   = v.matches   || {};
  S.matchAvail= v.matchAvail|| {};
  S.umpGames  = v.umpGames  || {};
  S.umpSlots  = v.umpSlots  || {};

  if (!seeded) { seeded=true; seedIfEmpty(); }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('live-badge').style.display = 'flex';
  document.getElementById('hdr-sub').textContent = 'Mega Smash 2026 · Live';
  populatePlayerSel();
  render();
});

// Archive: read /v2/ read-only
onValue(ref(db,'/v2/tournaments'), snap => { S.archiveV2 = snap.val()||{}; });

async function seedIfEmpty() {
  const upd = {};
  if (!Object.keys(S.roster).length)
    DEFAULT_ROSTER.forEach(n => { upd[`/ms2026/roster/${pKey(n)}`] = {name:n, cert:false}; });
  if (!Object.keys(S.matches).length)
    MATCH_SEED.forEach(m => { upd[`/ms2026/matches/${m.id}`] = m; });
  if (!Object.keys(S.umpGames).length)
    UMP_SEED.forEach(u => { upd[`/ms2026/umpGames/${u.id}`] = u; upd[`/ms2026/umpSlots/${u.id}`] = {slot1:null,slot2:null}; });
  if (Object.keys(upd).length) await update(ref(db), upd);
}

/* ─── Player selector ───────────────────────────────────────────────────── */
function populatePlayerSel() {
  const sel = document.getElementById('player-sel');
  const prev = currentPlayer;
  sel.innerHTML = '<option value="">— select your name —</option>';
  rList().forEach(p => {
    const o = document.createElement('option');
    o.value = p.name; o.textContent = p.name; sel.appendChild(o);
  });
  sel.value = prev;
}
window.onPlayerChange = () => {
  currentPlayer = document.getElementById('player-sel').value;
  localStorage.setItem('tridents_player', currentPlayer);
  render();
};

/* ─── Tab navigation ────────────────────────────────────────────────────── */
window.setTopTab = (tab, btn) => {
  topTab = tab;
  document.querySelectorAll('.top-tab').forEach(b => {
    b.className = 'top-tab px-5 py-3 text-sm font-bold border-b-2 border-transparent text-stone-400 hover:text-stone-600 transition-colors';
  });
  btn.className = 'top-tab px-5 py-3 text-sm font-bold border-b-2 border-green-600 text-green-700';
  document.getElementById('ms-subtabs').style.display = tab==='ms2026' ? '' : 'none';
  render();
};

window.setSubTab = (tab, btn) => {
  subTab = tab;
  const styles = {
    roster:   'sub-tab px-4 py-2.5 text-sm font-bold border-b-2 border-blue-600 text-blue-700',
    matches:  'sub-tab px-4 py-2.5 text-sm font-bold border-b-2 border-green-600 text-green-700',
    umpiring: 'sub-tab px-4 py-2.5 text-sm font-bold border-b-2 border-orange-500 text-orange-700',
  };
  const off = 'sub-tab px-4 py-2.5 text-sm font-bold border-b-2 border-transparent text-stone-400 hover:text-stone-600 transition-colors';
  document.querySelectorAll('.sub-tab').forEach(b => b.className = off);
  btn.className = styles[tab];
  render();
};

/* ─── Main render ───────────────────────────────────────────────────────── */
function render() {
  document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
  if (topTab==='archive') {
    document.getElementById('sec-archive').classList.remove('hidden');
    renderArchive();
  } else {
    const sec = document.getElementById('sec-'+subTab);
    if (sec) sec.classList.remove('hidden');
    if (subTab==='roster')    renderRoster();
    if (subTab==='matches')   renderMatches();
    if (subTab==='umpiring')  renderUmpiring();
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   ARCHIVE
══════════════════════════════════════════════════════════════════════════ */
function renderArchive() {
  const el = document.getElementById('sec-archive');
  const ids = Object.keys(S.archiveV2);
  el.innerHTML = `
<div class="mb-5">
  <h2 class="text-xl font-black text-stone-800 mb-1">Season Archive</h2>
  <p class="text-sm text-stone-400">Previous tournament data stored in Firebase. Read-only.</p>
</div>
<div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-5 flex gap-3">
  <span class="text-xl">📦</span>
  <div>
    <div class="font-semibold text-amber-800 text-sm">Data preserved</div>
    <div class="text-xs text-amber-600 mt-0.5">Previous seasons and umpiring records are safely stored in Firebase under their original paths and will not be affected by Mega Smash 2026 data.</div>
  </div>
</div>
${!ids.length
  ? `<div class="bg-white rounded-2xl border border-stone-200 p-10 text-center text-stone-400">
      <div class="text-4xl mb-2">🗄️</div>
      <p class="font-semibold text-stone-500">No previous seasons found</p>
      <p class="text-sm mt-1">Archived tournament data will appear here.</p>
    </div>`
  : ids.map(id => {
      const t = S.archiveV2[id];
      return `<div class="bg-white rounded-2xl border border-stone-200 shadow-sm p-5 mb-3 flex items-center justify-between">
        <div>
          <div class="font-bold text-stone-800">${esc(t.name)}</div>
          <div class="text-xs text-stone-400 mt-0.5">Season ${esc(t.season||'')} · ${new Date(t.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
        </div>
        <span class="text-xs font-bold text-stone-400 bg-stone-100 px-3 py-1 rounded-full">Archived</span>
      </div>`;
    }).join('')}`;
}

/* ══════════════════════════════════════════════════════════════════════════
   ROSTER
══════════════════════════════════════════════════════════════════════════ */
function renderRoster() {
  const el = document.getElementById('sec-roster');
  const players = rList();
  const certified = players.filter(p=>p.cert).length;
  const certPct = players.length ? Math.round(certified/players.length*100) : 0;

  // Umpiring counts per player
  const uc = {};
  players.forEach(p => uc[pKey(p.name)] = 0);
  Object.values(S.umpSlots).forEach(s => {
    if (s?.slot1) uc[s.slot1] = (uc[s.slot1]||0)+1;
    if (s?.slot2) uc[s.slot2] = (uc[s.slot2]||0)+1;
  });
  const unassigned = players.filter(p => !uc[pKey(p.name)]);

  el.innerHTML = `
<!-- Cert progress banner -->
<div class="bg-gradient-to-br from-blue-500 to-blue-700 rounded-2xl p-5 mb-5 text-white shadow-sm">
  <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
    <div>
      <div class="font-black text-xl">Umpiring Certification Tracker</div>
      <div class="text-blue-100 text-sm mt-0.5">${certified} of ${players.length} players certified</div>
    </div>
    <div class="text-4xl font-black">${certPct}%</div>
  </div>
  <div class="w-full bg-blue-900 bg-opacity-40 rounded-full h-3 overflow-hidden">
    <div class="h-full bg-white rounded-full transition-all duration-700" style="width:${certPct}%"></div>
  </div>
  ${certified < players.length
    ? `<div class="mt-2 text-blue-100 text-xs">${players.length-certified} player${players.length-certified!==1?'s':''} yet to complete certification</div>`
    : `<div class="mt-2 text-white text-xs font-bold">🎉 All players certified!</div>`}
</div>

<!-- Umpiring assignment overview -->
<div class="bg-white rounded-2xl border border-stone-200 shadow-sm p-5 mb-5">
  <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
    <div class="font-black text-stone-800">Umpiring Assignment Overview</div>
    <span class="text-xs font-bold px-2.5 py-1 rounded-full ${unassigned.length ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">
      ${unassigned.length ? `⚠️ ${unassigned.length} need assignment` : '✓ All assigned'}
    </span>
  </div>
  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">
    ${players.map(p => {
      const cnt = uc[pKey(p.name)]||0;
      return `<div class="flex items-center gap-2 p-2.5 rounded-xl border ${cnt>=1?'bg-green-50 border-green-200':'bg-red-50 border-red-200'}">
        <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-black shrink-0 ${cnt>=1?'bg-green-500 text-white':'bg-red-400 text-white'}">${cnt}</div>
        <span class="text-xs font-semibold truncate ${cnt>=1?'text-green-800':'text-red-700'}">${esc(p.name.split(' ')[0])}</span>
      </div>`;
    }).join('')}
  </div>
</div>

<!-- Full roster list -->
<div class="bg-white rounded-2xl border border-stone-200 shadow-sm overflow-hidden">
  <div class="px-5 py-4 bg-stone-50 border-b border-stone-200 flex items-center justify-between flex-wrap gap-2">
    <h2 class="font-black text-stone-800">Team Roster <span class="text-stone-400 font-normal">(${players.length} players)</span></h2>
    <span class="text-xs text-stone-400">Click 🏅 to toggle certification</span>
  </div>
  <div class="divide-y divide-stone-100">
    ${players.map((p,i) => {
      const key = pKey(p.name); const cnt = uc[key]||0;
      const ini = p.name.split(' ').slice(0,2).map(w=>w[0]).join('');
      const isCurrent = currentPlayer === p.name;
      return `
<div class="px-5 py-3 flex items-center gap-3 ${isCurrent?'bg-blue-50':''}">
  <span class="text-xs text-stone-300 w-5 text-right shrink-0">${i+1}</span>
  <div class="w-8 h-8 rounded-full ${isCurrent?'bg-blue-500 text-white':'bg-blue-100 text-blue-700'} flex items-center justify-center text-xs font-black shrink-0">${ini}</div>
  <div class="flex-1 min-w-0">
    <div class="font-semibold text-sm ${isCurrent?'text-blue-800':''}">${esc(p.name)}${isCurrent?' 👈':''}</div>
    <div class="text-xs mt-0.5 flex items-center gap-2">
      <span class="${p.cert?'text-green-600 font-bold':'text-red-500'}">${p.cert?'✓ Certified':'✗ Not certified'}</span>
      <span class="text-stone-300">·</span>
      <span class="${cnt>=1?'text-green-600':'text-red-500'} font-medium">${cnt} umpiring${cnt!==1?'s':''}</span>
    </div>
  </div>
  <button onclick="toggleCert('${key}')" class="text-xl hover:scale-125 transition-transform px-1 select-none" title="Toggle certification">${p.cert?'🏅':'⬜'}</button>
  <button onclick="deletePlayer('${key}')" class="text-stone-200 hover:text-red-400 transition-colors text-sm px-1">✕</button>
</div>`;
    }).join('')}
  </div>
  <div class="px-5 py-4 bg-stone-50 border-t border-stone-100">
    <div class="flex gap-2">
      <input type="text" id="new-player" placeholder="Full player name…"
        class="flex-1 text-sm border border-stone-300 rounded-xl px-3.5 py-2 bg-white"
        onkeydown="if(event.key==='Enter')addPlayer()">
      <button onclick="addPlayer()"
        class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-black px-5 py-2 rounded-xl transition-colors">Add</button>
    </div>
  </div>
</div>`;
}

window.toggleCert = async k => {
  const cur = S.roster[k]?.cert||false;
  await set(ref(db,`/ms2026/roster/${k}/cert`), !cur);
  toast(cur ? '⬜ Certification removed' : '🏅 Player certified!');
};
window.addPlayer = async () => {
  const inp = document.getElementById('new-player');
  const name = inp?.value.trim();
  if (!name) { toast('Enter a player name'); return; }
  if (rList().some(p=>p.name===name)) { toast('Already in roster'); return; }
  await set(ref(db,`/ms2026/roster/${pKey(name)}`), {name, cert:false});
  inp.value=''; toast(`✓ Added ${name}`);
};
window.deletePlayer = async k => {
  const name = S.roster[k]?.name;
  if (!confirm(`Remove ${name} from roster?`)) return;
  await remove(ref(db,`/ms2026/roster/${k}`));
  if (currentPlayer===name) { currentPlayer=''; localStorage.removeItem('tridents_player'); }
  toast(`Removed ${name}`);
};

/* ══════════════════════════════════════════════════════════════════════════
   MATCH SCHEDULE
══════════════════════════════════════════════════════════════════════════ */
function renderMatches() {
  const el = document.getElementById('sec-matches');
  const matches = Object.values(S.matches).sort((a,b)=>dateSort(a.date).localeCompare(dateSort(b.date)));
  const players = rList();

  let totalResp=0;
  matches.forEach(m => {
    const av = S.matchAvail[m.id]||{};
    players.forEach(p => { if(av[pKey(p.name)]) totalResp++; });
  });
  const totalPoss = players.length * matches.length;
  const pct = totalPoss ? Math.round(totalResp/totalPoss*100) : 0;

  const upcoming = matches.filter(m=>!isPast(m.date));
  const past     = matches.filter(m=>isPast(m.date));

  el.innerHTML = `
<!-- Banner -->
<div class="bg-gradient-to-r from-green-500 to-green-700 rounded-2xl p-5 mb-5 text-white shadow-sm flex items-center justify-between flex-wrap gap-3">
  <div>
    <div class="font-black text-xl">Match Schedule · Division 2</div>
    <div class="text-green-100 text-sm mt-0.5">${matches.length} games · Mega Smash 2026</div>
  </div>
  <div class="text-right">
    <div class="text-4xl font-black">${pct}%</div>
    <div class="text-green-100 text-xs">overall response rate</div>
  </div>
</div>

${upcoming.length ? `
<div class="text-xs font-black text-stone-500 uppercase tracking-widest mb-3">Upcoming (${upcoming.length})</div>
<div class="space-y-3 mb-6">${upcoming.map((m,i)=>matchCardHTML(m,matches.indexOf(m)+1,players)).join('')}</div>` : ''}

${past.length ? `
<div class="text-xs font-black text-stone-400 uppercase tracking-widest mb-3">Past Games (${past.length})</div>
<div class="space-y-3 opacity-80">${past.map(m=>matchCardHTML(m,matches.indexOf(m)+1,players)).join('')}</div>` : ''}`;
}

function matchCardHTML(m, num, players) {
  const av = S.matchAvail[m.id]||{};
  let nA=0,nM=0,nN=0;
  players.forEach(p => { const s=av[pKey(p.name)]; if(s==='available')nA++; else if(s==='maybe')nM++; else if(s==='not_available')nN++; });
  const nPend = players.length-nA-nM-nN;
  const myStatus = currentPlayer ? av[pKey(currentPlayer)] : null;
  const past = isPast(m.date);

  const btnCls = s => {
    const base = 'flex-1 py-2 text-sm font-bold rounded-xl border-2 cursor-pointer text-center transition-all select-none';
    const on   = {available:'bg-green-500 border-green-500 text-white', maybe:'bg-amber-400 border-amber-400 text-white', not_available:'bg-red-500 border-red-500 text-white'};
    const off  = {available:'border-green-200 text-green-700 hover:border-green-400 hover:bg-green-50', maybe:'border-amber-200 text-amber-700 hover:border-amber-400 hover:bg-amber-50', not_available:'border-red-200 text-red-700 hover:border-red-400 hover:bg-red-50'};
    return `${base} ${myStatus===s ? on[s] : off[s]}`;
  };

  const chips = players.filter(p=>av[pKey(p.name)]).map(p => {
    const s=av[pKey(p.name)];
    const col = s==='available'?'bg-green-100 text-green-800':s==='maybe'?'bg-amber-100 text-amber-800':'bg-red-100 text-red-800';
    return `<span class="${col} text-xs px-2 py-0.5 rounded-full font-semibold">${s==='available'?'✓':s==='maybe'?'~':'✗'} ${esc(p.name.split(' ')[0])}</span>`;
  }).join('');

  return `
<div class="card-in bg-white rounded-2xl border border-stone-200 shadow-sm overflow-hidden">
  <div class="bg-gradient-to-r ${past?'from-stone-400 to-stone-500':'from-green-500 to-green-700'} px-4 py-2.5 flex items-center justify-between">
    <span class="text-white text-[11px] font-black tracking-widest">GAME ${num} · ${esc(m.division)}${past?' · COMPLETED':''}</span>
    <span class="text-white text-xs opacity-90">${esc(m.date)} · ${esc(m.time)}</span>
  </div>
  <div class="p-4">
    <div class="flex items-start justify-between gap-3 mb-1">
      <div class="text-xl font-black">vs <span class="${past?'text-stone-600':'text-green-700'}">${esc(m.opponent)}</span></div>
      <span class="text-xs font-black px-2.5 py-1 rounded-full shrink-0 ${m.isHome?'bg-green-100 text-green-700':'bg-stone-100 text-stone-600'}">
        ${m.isHome?'🏠 HOME':'✈️ AWAY'}
      </span>
    </div>
    <div class="text-sm text-stone-400 mb-4">📍 ${esc(m.venue)}</div>
    ${currentPlayer
      ? `<div class="flex gap-2 mb-4">
           <button onclick="setMatchAvail('${m.id}','available')" class="${btnCls('available')}">✓ Available</button>
           <button onclick="setMatchAvail('${m.id}','maybe')" class="${btnCls('maybe')}">~ Maybe</button>
           <button onclick="setMatchAvail('${m.id}','not_available')" class="${btnCls('not_available')}">✗ Can't Make It</button>
         </div>`
      : `<div class="mb-4 bg-stone-50 rounded-xl px-4 py-3 text-sm text-stone-400 text-center border border-stone-100">Select your name in the header to mark your availability</div>`}
    <div class="flex items-center gap-4 text-xs font-bold">
      <span class="text-green-600">✓ ${nA}</span>
      <span class="text-amber-500">~ ${nM}</span>
      <span class="text-red-500">✗ ${nN}</span>
      ${nPend>0?`<span class="text-stone-300 font-normal ml-auto">${nPend} no reply</span>`:''}
    </div>
    ${chips?`<div class="flex flex-wrap gap-1.5 mt-3">${chips}</div>`:''}
  </div>
</div>`;
}

window.setMatchAvail = async (matchId, status) => {
  if (!currentPlayer) { toast('Select your name first ☝️'); return; }
  const path = `/ms2026/matchAvail/${matchId}/${pKey(currentPlayer)}`;
  const cur  = S.matchAvail[matchId]?.[pKey(currentPlayer)];
  await set(ref(db,path), cur===status ? null : status);
  const msgs={available:'✓ Marked available!', maybe:'~ Marked maybe', not_available:'✗ Marked unavailable'};
  toast(cur===status ? 'Response cleared' : msgs[status]);
};

/* ══════════════════════════════════════════════════════════════════════════
   UMPIRING
══════════════════════════════════════════════════════════════════════════ */
function renderUmpiring() {
  const el = document.getElementById('sec-umpiring');
  const players = rList();

  // Assignment counts
  const uc = {};
  players.forEach(p => uc[pKey(p.name)]=0);
  Object.values(S.umpSlots).forEach(s => {
    if (s?.slot1) uc[s.slot1]=(uc[s.slot1]||0)+1;
    if (s?.slot2) uc[s.slot2]=(uc[s.slot2]||0)+1;
  });
  const assigned  = players.filter(p=>(uc[pKey(p.name)]||0)>=1);
  const needsAssign = players.filter(p=>!(uc[pKey(p.name)]||0));
  const pct = players.length ? Math.round(assigned.length/players.length*100) : 0;

  const games = Object.entries(S.umpGames)
    .map(([id,g])=>({...g,id}))
    .sort((a,b)=>dateSort(a.date).localeCompare(dateSort(b.date)));

  el.innerHTML = `
<!-- Requirement banner -->
<div class="bg-gradient-to-br from-orange-400 to-orange-600 rounded-2xl p-5 mb-5 text-white shadow-sm">
  <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
    <div>
      <div class="font-black text-xl">Umpiring Schedule</div>
      <div class="text-orange-100 text-sm mt-0.5">Every player must complete at least 1 umpiring duty</div>
    </div>
    <div class="text-right">
      <div class="text-4xl font-black">${assigned.length}/${players.length}</div>
      <div class="text-orange-100 text-xs">players assigned</div>
    </div>
  </div>
  <div class="w-full bg-orange-700 bg-opacity-50 rounded-full h-2.5 overflow-hidden">
    <div class="h-full bg-white rounded-full transition-all duration-700" style="width:${pct}%"></div>
  </div>
</div>

<!-- Who needs assignment -->
${needsAssign.length ? `
<div class="bg-white rounded-2xl border border-red-200 shadow-sm p-4 mb-5">
  <div class="text-xs font-black text-red-600 uppercase tracking-widest mb-2.5">⚠️ Players Needing Umpiring Assignment (${needsAssign.length})</div>
  <div class="flex flex-wrap gap-1.5">
    ${needsAssign.map(p=>`<span class="bg-red-50 border border-red-200 text-red-700 text-xs px-2.5 py-1 rounded-full font-semibold">${esc(p.name)}</span>`).join('')}
  </div>
</div>` : `
<div class="bg-green-50 border border-green-200 rounded-2xl p-4 mb-5 text-center">
  <span class="text-green-700 font-black text-sm">🎉 All players have at least one umpiring assignment!</span>
</div>`}

<!-- Game cards -->
<div class="space-y-3 mb-5">
  ${games.map(g=>umpCardHTML(g, players)).join('')}
</div>

<!-- Add umpiring assignment -->
<div class="bg-white rounded-2xl border border-stone-200 shadow-sm overflow-hidden">
  <button onclick="window.toggleAddForm()" class="w-full px-5 py-4 flex items-center justify-between text-left hover:bg-stone-50 transition-colors">
    <div>
      <div class="font-black text-stone-700">➕ Add Umpiring Assignment</div>
      <div class="text-xs text-stone-400 mt-0.5">For newly published umpiring duties</div>
    </div>
    <span class="text-stone-400 text-lg">${showAddUmpForm?'▲':'▼'}</span>
  </button>
  ${showAddUmpForm ? `
  <div class="px-5 pb-5 border-t border-stone-100">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
      <div>
        <label class="block text-xs font-black text-stone-500 mb-1.5 uppercase tracking-wide">Date</label>
        <input type="text" id="uf-date" placeholder="M/D/YYYY e.g. 8/15/2026" class="w-full text-sm border border-stone-300 rounded-xl px-3 py-2 bg-white">
      </div>
      <div>
        <label class="block text-xs font-black text-stone-500 mb-1.5 uppercase tracking-wide">Time</label>
        <input type="text" id="uf-time" placeholder="e.g. 10:00 AM" class="w-full text-sm border border-stone-300 rounded-xl px-3 py-2 bg-white">
      </div>
      <div>
        <label class="block text-xs font-black text-stone-500 mb-1.5 uppercase tracking-wide">Team 1</label>
        <input type="text" id="uf-t1" placeholder="Team name" class="w-full text-sm border border-stone-300 rounded-xl px-3 py-2 bg-white">
      </div>
      <div>
        <label class="block text-xs font-black text-stone-500 mb-1.5 uppercase tracking-wide">Team 2</label>
        <input type="text" id="uf-t2" placeholder="Team name" class="w-full text-sm border border-stone-300 rounded-xl px-3 py-2 bg-white">
      </div>
      <div class="sm:col-span-2">
        <label class="block text-xs font-black text-stone-500 mb-1.5 uppercase tracking-wide">Venue</label>
        <input type="text" id="uf-venue" placeholder="Park / ground name" class="w-full text-sm border border-stone-300 rounded-xl px-3 py-2 bg-white">
      </div>
      <div>
        <label class="block text-xs font-black text-stone-500 mb-1.5 uppercase tracking-wide">Division (optional)</label>
        <input type="text" id="uf-div" placeholder="e.g. D3" class="w-full text-sm border border-stone-300 rounded-xl px-3 py-2 bg-white">
      </div>
    </div>
    <button onclick="addUmpGame()"
      class="mt-4 w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-3 rounded-xl transition-colors">
      Save Umpiring Assignment
    </button>
  </div>` : ''}
</div>`;
}

function umpCardHTML(g, players) {
  const slots = S.umpSlots[g.id] || {};
  const s1 = slots.slot1||null, s2 = slots.slot2||null;
  const p1 = s1 ? pName(s1) : null;
  const p2 = s2 ? pName(s2) : null;
  const isFull = !!(s1 && s2);
  const myKey  = currentPlayer ? pKey(currentPlayer) : null;
  const mySlot = myKey && (s1===myKey || s2===myKey);
  const past   = isPast(g.date);
  const isSeeded = g.id==='u0'||g.id==='u1'||g.id==='u2';

  let actionBtn = '';
  if (mySlot) {
    actionBtn = `<button onclick="withdrawUmp('${g.id}')"
      class="w-full mt-3 py-2.5 text-sm font-bold rounded-xl border-2 border-red-300 text-red-600 hover:bg-red-50 transition-colors">
      ↩ Withdraw My Sign-up
    </button>`;
  } else if (!isFull && currentPlayer) {
    actionBtn = `<button onclick="signUpUmp('${g.id}')"
      class="w-full mt-3 py-2.5 text-sm font-black rounded-xl bg-orange-500 hover:bg-orange-600 text-white transition-colors shadow-sm">
      Sign Up to Umpire This Game
    </button>`;
  } else if (isFull) {
    actionBtn = `<div class="mt-3 py-2 text-center text-sm text-stone-400 font-semibold">Both umpire slots are filled</div>`;
  } else {
    actionBtn = `<div class="mt-3 py-2 text-center text-sm text-stone-400">Select your name above to sign up</div>`;
  }

  const slotBox = (label, player, isMe) => `
<div class="rounded-xl border-2 p-3 text-center ${player?'border-green-300 bg-green-50':'border-dashed border-stone-200 bg-stone-50'}">
  <div class="text-[10px] font-black text-stone-400 uppercase tracking-widest mb-1.5">${label}</div>
  ${player
    ? `<div class="font-bold text-sm text-green-700 leading-tight">${esc(player)}</div>${isMe?'<div class="text-[10px] text-green-500 mt-1 font-bold">← You</div>':''}`
    : `<div class="text-sm text-stone-300 font-semibold">Open</div>`}
</div>`;

  return `
<div class="card-in bg-white rounded-2xl border border-stone-200 shadow-sm overflow-hidden">
  <div class="bg-gradient-to-r ${past?'from-stone-400 to-stone-500':'from-orange-400 to-orange-600'} px-4 py-2.5 flex items-center justify-between">
    <span class="text-white text-[11px] font-black tracking-widest">🦺 UMPIRING${g.division?' · '+esc(g.division):''}${past?' · COMPLETED':''}</span>
    <div class="flex items-center gap-2">
      <span class="text-white text-xs opacity-90">${esc(g.date)} · ${esc(g.time)}</span>
      <span class="text-xs font-black px-2 py-0.5 rounded-full ${isFull?'bg-white text-orange-600':'bg-orange-300 text-white'}">
        ${isFull?'✓ FILLED':'OPEN'}
      </span>
    </div>
  </div>
  <div class="p-4">
    <div class="flex items-start justify-between gap-2 mb-1">
      <div class="text-lg font-black">${esc(g.team1)} <span class="text-stone-400 font-normal">vs</span> ${esc(g.team2)}</div>
      ${!isSeeded?`<button onclick="deleteUmpGame('${g.id}')" class="text-stone-200 hover:text-red-400 transition-colors text-sm shrink-0">✕</button>`:''}
    </div>
    <div class="text-sm text-stone-400 mb-4">📍 ${esc(g.venue)}</div>
    <div class="grid grid-cols-2 gap-3">
      ${slotBox('Umpire 1', p1, s1===myKey)}
      ${slotBox('Umpire 2', p2, s2===myKey)}
    </div>
    ${actionBtn}
  </div>
</div>`;
}

window.signUpUmp = async gId => {
  if (!currentPlayer) { toast('Select your name first ☝️'); return; }
  const k = pKey(currentPlayer);
  const s = S.umpSlots[gId]||{};
  if (s.slot1===k||s.slot2===k) { toast('Already signed up for this game'); return; }
  if (s.slot1&&s.slot2) { toast('Both slots are already filled'); return; }
  const field = !s.slot1 ? 'slot1' : 'slot2';
  await update(ref(db,`/ms2026/umpSlots/${gId}`), {[field]:k});
  toast('✓ Signed up to umpire! 🦺');
};
window.withdrawUmp = async gId => {
  if (!currentPlayer) return;
  const k = pKey(currentPlayer);
  const s = S.umpSlots[gId]||{};
  if (s.slot1===k) await update(ref(db,`/ms2026/umpSlots/${gId}`), {slot1:null});
  else if (s.slot2===k) await update(ref(db,`/ms2026/umpSlots/${gId}`), {slot2:null});
  toast('Withdrawn from umpiring slot');
};
window.toggleAddForm = () => { showAddUmpForm=!showAddUmpForm; renderUmpiring(); };
window.addUmpGame = async () => {
  const v = f => document.getElementById(f)?.value.trim();
  const date=v('uf-date'), time=v('uf-time'), t1=v('uf-t1'), t2=v('uf-t2'), venue=v('uf-venue'), div=v('uf-div');
  if (!date||!t1||!t2||!venue) { toast('Please fill in Date, Team 1, Team 2, and Venue'); return; }
  const nr = push(ref(db,'/ms2026/umpGames')); const id=nr.key;
  const upd={};
  upd[`/ms2026/umpGames/${id}`] = {id, date, time:time||'TBD', team1:t1, team2:t2, venue, division:div||''};
  upd[`/ms2026/umpSlots/${id}`] = {slot1:null, slot2:null};
  await update(ref(db),upd);
  showAddUmpForm=false; toast('✓ Umpiring assignment added!');
};
window.deleteUmpGame = async id => {
  if (!confirm('Remove this umpiring assignment and all sign-ups?')) return;
  await remove(ref(db,`/ms2026/umpGames/${id}`));
  await remove(ref(db,`/ms2026/umpSlots/${id}`));
  toast('Removed');
};
</script>
</body>
</html>
